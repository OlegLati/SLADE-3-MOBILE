plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.oleglati.slade_3_mobile'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.oleglati.slade_3_mobile'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        // Both test devices (TECNO BG6, HUAWEI MatePad T) are arm64-v8a.
        // Without this, AGP builds all 4 default ABIs (armeabi-v7a,
        // arm64-v8a, x86, x86_64) on every build -- i.e. slade_core's
        // whole C++ source list gets compiled 4 times over. Cutting that
        // to 1 ABI is a straight ~4x cut in total compiler work, which
        // matters a lot on a memory/CPU-constrained on-device build.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildFeatures {
        viewBinding true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '4.1.2'
        }
    }

    // Debug builds include the native regression runner. Release builds keep
    // the test executables and runner code disabled by CMake's default OFF.
    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    arguments "-DBUILD_NATIVE_TESTS=ON"
                }
            }
        }
        release {
            externalNativeBuild {
                cmake {
                    arguments "-DBUILD_NATIVE_TESTS=OFF"
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation("androidx.recyclerview:recyclerview:1.3.2")
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
}
